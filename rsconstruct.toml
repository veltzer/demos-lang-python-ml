# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[analyzer.markdown]

[analyzer.python]

[processor.rumdl]
src_dirs = ["src", "notes"]

[processor.zspell]
src_dirs = ["src", "notes"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src"]

[processor.pylint]
src_dirs = ["src"]

[processor.mypy]
src_dirs = ["src"]
batch = false
# batch = false means one mypy process per file, and parallel mypy processes
# share one .mypy_cache. mypy's cache is not safe under concurrent writers:
# when the cache is cold (every CI run) the racing processes flakily die with
# "INTERNAL ERROR" (reproducible locally with 4 parallel mypy runs on a cold
# cache). max_jobs = 1 serializes only the mypy invocations -- same checks,
# warm-cache runs are ~1s/file -- while other processors stay parallel.
max_jobs = 1

[processor.requirements]
src_dirs = ["src"]

[processor.taplo]
src_dirs = ["."]

# Runtime deps so CI installs what the demos import (pylint/mypy resolve
# them) -- the demos-cloud-aws pattern. plotly ships no py.typed and its
# community stubs (plotly-stubs) are stricter than the runtime accepts (they
# reject a str path to write_html that plotly happily takes), so plotly is
# left unstubbed and its imports are ignored for typing rather than adding a
# stub package that would fail correct demo code.
[dependencies]
pip = [
    "matplotlib",
    "numpy",
    "pandas",
    "pandas-stubs",
    "plotly",
    "polars",
    "psutil",
    "scikit-learn",
    "seaborn",
    "types-psutil",
]
