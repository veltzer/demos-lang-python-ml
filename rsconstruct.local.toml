# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# The same demo deliberately exists under sibling dirs (02_pandas/ and
# 03_polars/ both have 00_create_series.py and friends) so the material reads
# side by side. Batched mypy maps both to one module name and dies with
# "Duplicate module" whenever they land in the same invocation -- flakily,
# since batch composition varies. batch = false checks every file in its own
# invocation: same checks, no shared namespace. The numbered directories
# cannot become packages (02_pandas is not a valid identifier), so mypy's
# suggested __init__.py fix is unavailable.
[processor.mypy]
batch = false

# Runtime deps so CI installs what the demos import (pylint/mypy resolve
# them) -- the demos-cloud-aws pattern. plotly ships no py.typed and its
# community stubs (plotly-stubs) are stricter than the runtime accepts (they
# reject a str path to write_html that plotly happily takes), so plotly is
# left unstubbed and its imports are ignored for typing rather than adding a
# stub package that would fail correct demo code.
[dependencies]
pip = [
    "matplotlib",
    "numpy",
    "pandas",
    "pandas-stubs",
    "plotly",
    "polars",
    "psutil",
    "scikit-learn",
    "seaborn",
]
